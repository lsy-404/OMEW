name: Release Overture package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to package
        required: true
        type: string

jobs:
  package:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run package:overture
        env:
          OMEW_TAG: ${{ env.RELEASE_TAG }}
          OMEW_BUILD_TIME: ${{ github.event.release.published_at }}
      - run: gh release upload "$RELEASE_TAG" dist-overture/overture.json dist-overture/overture.tar.gz dist-overture/overture.tar.gz.sha256 --clobber
        env:
          GH_TOKEN: ${{ github.token }}
